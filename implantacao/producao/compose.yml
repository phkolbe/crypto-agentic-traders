# Producao do Sistema Cripto: uma stack so dele, isolada de qualquer outro sistema
# que more no mesmo servidor (cofre Obsidian cryptocoins, implantacao.md).
#
#     implantacao/producao/implantar.sh            # no servidor, com /opt/crypto preparado
#
# Quatro conteineres numa rede propria (`crypto-prd`):
#   tailscale  no Tailscale `crypto`: o unico caminho de entrada. O `tailscale serve`
#              termina o HTTPS (*.ts.net) e repassa a API pondo o login de quem
#              acessa em Tailscale-User-Login; a API so aceita ACESSO_LOGIN_TAILSCALE,
#              e so quando a conexao vem DESTE conteiner (ACESSO_PROXY_TAILSCALE).
#   postgres   Postgres 16 proprio (database `crypto`, usuarios crypto_dono e crypto).
#   migrar     schema e gatilhos com o usuario dono; roda e sai.
#   crypto     agentes + API + telas, com o usuario da aplicacao (so linhas).
# Nenhuma porta publicada no servidor. A porta da API (8000) e alcancavel pelo host e
# pelos conteineres da rede pelo IP da bridge; por isso o cabecalho do Tailscale so vale
# vindo do conteiner tailscale, e os outros conteineres nao tem NET_RAW (sem ele nao se
# forja pacote com o IP de outro conteiner na bridge). A telemetria sai por OTLP para
# OTEL_ENDPOINT (a observabilidade, onde ela estiver); vazio, nao sai.
#
# Variaveis: /opt/crypto/.env (preparar.sh) e /opt/crypto/crypto.env (modo, chaves da
# Binance, SMTP, WhatsApp). O que esta em `environment` vence o crypto.env.

name: crypto-prd

x-logs: &logs
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-imagem: &imagem
  image: ghcr.io/phkolbe/crypto:${VERSAO_CRYPTO:?defina VERSAO_CRYPTO no .env}

services:
  tailscale:
    image: tailscale/tailscale:${VERSAO_TAILSCALE:-v1.84.3}
    container_name: crypto-prd-tailscale
    hostname: ${TS_HOSTNAME:-crypto}
    restart: unless-stopped
    <<: *logs
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-crypto}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace: sem /dev/net/tun nem NET_ADMIN; o `serve` funciona igual.
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks: [crypto]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.25"}

  postgres:
    image: postgres:16-alpine
    container_name: crypto-prd-postgres
    restart: unless-stopped
    <<: *logs
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SENHA_DB_POSTGRES:?}
      # Lidas pelo postgres_init.sh so na primeira subida do volume.
      CRYPTO_SENHA_DONO: ${SENHA_DB_CRYPTO_DONO:?}
      CRYPTO_SENHA_APP: ${SENHA_DB_CRYPTO:?}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    cap_drop: [NET_RAW]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../../docker/postgres_init.sh:/docker-entrypoint-initdb.d/00-crypto.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [crypto]
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}

  migrar:
    <<: *imagem
    container_name: crypto-prd-migrar
    restart: "no"
    command: ["crypto-traders", "migrar", "--usuario-aplicacao", "crypto"]
    cap_drop: [NET_RAW]
    environment:
      DATABASE_URL: postgresql+asyncpg://crypto_dono:${SENHA_DB_CRYPTO_DONO}@crypto-prd-postgres:5432/crypto
      ENVIRONMENT: prd
    depends_on:
      postgres: {condition: service_healthy}
    networks: [crypto]

  crypto:
    <<: [*imagem, *logs]
    container_name: crypto-prd
    restart: unless-stopped
    cap_drop: [NET_RAW]
    env_file:
      - path: ${PASTA:?}/crypto.env
        required: true
    environment:
      ENVIRONMENT: prd
      DATABASE_URL: postgresql+asyncpg://crypto:${SENHA_DB_CRYPTO}@crypto-prd-postgres:5432/crypto
      DB_MIGRAR_NA_SUBIDA: "false"
      EVENT_BUS: memory
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: https://${TS_HOSTNAME:-crypto}.${TAILNET:?}
      # A trava: so este login Tailscale passa (api.app.PortaoTailscale), e so com a
      # conexao vindo do conteiner tailscale. A API escuta em 0.0.0.0 na bridge: sem a
      # origem, o host ou outro conteiner mandava o cabecalho com o login do dono direto
      # em http://<ip-da-bridge>:8000 (auditoria 09/11/2026). O nome e resolvido pelo
      # DNS da rede; recriado o conteiner (IP novo), a API resolve de novo.
      ACESSO_LOGIN_TAILSCALE: ${CRYPTO_LOGIN:?defina CRYPTO_LOGIN no .env}
      ACESSO_PROXY_TAILSCALE: crypto-prd-tailscale
      LOG_JSON: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
    depends_on:
      migrar: {condition: service_completed_successfully}
    # A parada drena: o evento em processamento (a ordem no meio do envio) tem ate 20 s
    # para terminar (agents.base.PRAZO_DRENAGEM_SEGUNDOS), e o que ficar vai para o log
    # e o audit_log. 10 s (o padrao do Docker) cortaria a drenagem no meio.
    stop_grace_period: 60s
    networks: [crypto]
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.0"}

volumes:
  tailscale:
    name: crypto-prd_tailscale
  postgres:
    name: crypto-prd_postgres

networks:
  crypto:
    name: crypto-prd
