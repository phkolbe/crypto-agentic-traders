<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Crypto Traders</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#fundo)"/>
  <!-- tendencia de alta, por tras dos candles -->
  <path d="M5 55 L22 45 L36 47 L59 19" fill="none" stroke="#58a6ff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tres candles subindo: vermelho, verde, verde -->
  <g stroke="#0d1117" stroke-width="2">
    <rect x="12" y="27" width="4" height="25" rx="2" fill="#f85149"/>
    <rect x="7" y="32" width="14" height="14" rx="3" fill="#f85149"/>
    <rect x="30" y="16" width="4" height="30" rx="2" fill="#3fb950"/>
    <rect x="25" y="21" width="14" height="18" rx="3" fill="#3fb950"/>
    <rect x="48" y="5" width="4" height="32" rx="2" fill="#3fb950"/>
    <rect x="43" y="9" width="14" height="22" rx="3" fill="#3fb950"/>
  </g>
</svg>
