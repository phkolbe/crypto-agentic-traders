# CI do Sistema Cripto: backend (ruff e a suite inteira, com Postgres de verdade) e
# frontend (typecheck, build e as verificacoes de tela).
#
# Postgres: com POSTGRES_TEST_URL a suite exercita o dialeto de producao (gatilhos
# append-only em plpgsql, o usuario da aplicacao sem privilegio de DDL, a copia do
# historico SQLite -> Postgres). O usuario e o superusuario do servico, porque os testes
# criam um database e um usuario proprios e os apagam no fim.
#
# A suite roda de dentro de `backend/`: um teste do grupo de ataques le arquivos de
# `src/` por caminho relativo (README, Testes).
#
# Actions fixadas por SHA do commit (versao no comentario): uma tag de action pode ser
# movida para outro commit; o SHA nao. Para atualizar: `git ls-remote --tags <repo>`.
# O imagem.yml so publica imagem de commit da main com este workflow verde.
#
# Imagem: o Dockerfile e construido aqui tambem (linux/arm64, a plataforma da producao,
# sem push). Antes ele so era construido na tag, e uma quebra de imagem (lock, npm,
# estagio do Dockerfile, digest de base que sumiu) aparecia na hora de publicar. O cache
# (type=gha) da main e o que o imagem.yml reaproveita na tag.
#
# Imagens de servico fixadas por digest, como no compose de producao (README da
# producao, "Imagens"): a CI testa contra o mesmo Postgres que roda la.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff e pytest, com Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres 16.15 (alpine)
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/crypto_teste
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q -rs

  frontend:
    name: Frontend (typecheck, build e verificacoes de tela)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check

  imagem:
    name: Imagem (build linux/arm64, sem push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ghcr.io/phkolbe/crypto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
