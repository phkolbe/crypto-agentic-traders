[project]
name = "crypto-agentic-traders"
version = "0.1.0"
description = "Agentes autonomos de negociacao de criptomoedas com Risk Manager como guardiao obrigatorio"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Paulo Kolbe", email = "paulo.kolbe@gmail.com" }]

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "ccxt>=4.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "structlog>=25.1",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
# Instalados apenas quando migrar de SQLite/in-memory para Postgres+Redis (docker compose up).
postgres = ["asyncpg>=0.30"]
redis = ["redis>=5.2"]
keyring = ["keyring>=25.5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
crypto-traders = "crypto_traders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/crypto_traders"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/src/crypto_traders"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
